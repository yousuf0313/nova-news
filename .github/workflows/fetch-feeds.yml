name: Nova News feeds refresh
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python3 fetch_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "nova-news-bot"
          git config user.email "nova-news-bot@users.noreply.github.com"
          git add data/feeds.json
          git diff --cached --quiet || git commit -m "Refresh news feeds [skip ci]"
          git push
