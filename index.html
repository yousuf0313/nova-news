<script>
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(u),
];
const LOCALES = { en:'en-GB', ur:'ur-PK', ar:'ar-EG', ja:'ja-JP', zh:'zh-CN' };
const LANGS = {
  en: { label:'English', dir:'ltr', cls:'', feeds:{ world:[
      {name:'BBC World', url:'https://feeds.bbci.co.uk/news/world/rss.xml'},
      {name:'Al Jazeera', url:'https://www.aljazeera.com/xml/rss/all.xml'} ],
    pakistan:[ {name:'Dawn', url:'https://www.dawn.com/feeds/home'} ],
    sports:[ {name:'BBC Sport', url:'https://feeds.bbci.co.uk/sport/rss.xml'} ],
    business:[ {name:'BBC Business', url:'https://feeds.bbci.co.uk/news/business/rss.xml'} ],
    technology:[ {name:'BBC Technology', url:'https://feeds.bbci.co.uk/news/technology/rss.xml'} ] },
    ui:{ breaking:'BREAKING NEWS', latest:'Latest News', crypto:'Live Crypto Prices', seeMore:'See more', seeLess:'See less', full:'Read full story', src:'Source', updated:'Last updated', refresh:'Refresh', loading:'Loading the latest news…', cats:{world:'World', pakistan:'Pakistan', sports:'Sports', business:'Business', technology:'Technology'} } },
  ur: { label:'اردو', dir:'rtl', cls:'rtl-text', feeds:{ world:[ {name:'BBC Urdu', url:'https://feeds.bbci.co.uk/urdu/rss.xml'} ] },
    ui:{ breaking:'بریکنگ نیوز', latest:'تازہ ترین خبریں', crypto:'کرپٹو کی لائیو قیمتیں', seeMore:'مزید دیکھیں', seeLess:'کم دیکھیں', full:'مکمل خبر پڑھیں', src:'ذریعہ', updated:'آخری تازہ کاری', refresh:'تازہ کریں', loading:'تازہ ترین خبریں آ رہی ہیں…', cats:{world:'دنیا'} } },
  ar: { label:'العربية', dir:'rtl', cls:'rtl-text', feeds:{ world:[ {name:'BBC Arabic', url:'https://feeds.bbci.co.uk/arabic/rss.xml'} ] },
    ui:{ breaking:'خبر عاجل', latest:'آخر الأخبار', crypto:'أسعار العملات الرقمية مباشر', seeMore:'شاهد المزيد', seeLess:'شاهد أقل', full:'اقرأ الخبر كاملاً', src:'المصدر', updated:'آخر تحديث', refresh:'تحديث', loading:'جارٍ تحميل آخر الأخبار…', cats:{world:'العالم'} } },
  ja: { label:'日本語', dir:'ltr', cls:'ja-text', feeds:{ world:[ {name:'NHK News', url:'https://www.nhk.or.jp/rss/news/cat0.xml'} ] },
    ui:{ breaking:'速報', latest:'最新ニュース', crypto:'暗号資産のライブ価格', seeMore:'もっと見る', seeLess:'閉じる', full:'全文を読む', src:'出典', updated:'最終更新', refresh:'更新', loading:'最新ニュースを読み込み中…', cats:{world:'世界'} } },
  zh: { label:'中文', dir:'ltr', cls:'zh-text', feeds:{ world:[ {name:'BBC 中文', url:'https://feeds.bbci.co.uk/zhongwen/rss.xml'} ] },
    ui:{ breaking:'突发新闻', latest:'最新消息', crypto:'加密货币实时价格', seeMore:'查看更多', seeLess:'收起', full:'阅读全文', src:'来源', updated:'最后更新', refresh:'刷新', loading:'正在加载最新消息…', cats:{world:'世界'} } },
};
const startLang = new URLSearchParams(location.search).get('lang');
let curLang = LANGS[startLang] ? startLang : 'en', curCat = 'world';

function esc(s){ const d=document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function strip(html){ const d=document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g,' ').trim(); }
function ago(date, lang){
  if(!date || isNaN(date)) return '';
  const m = Math.max(1, Math.round((Date.now() - date.getTime())/60000));
  const L = { en:[['minute ago','minutes ago'],['hour ago','hours ago']], ur:[['منٹ پہلے','منٹ پہلے'],['گھنٹہ پہلے','گھنٹے پہلے']], ar:[['قبل دقيقة','قبل دقائق'],['قبل ساعة','قبل ساعات']], ja:[['分前','分前'],['時間前','時間前']], zh:[['分钟前','分钟前'],['小时前','小时前']] }[lang] || [];
  if(m < 60) return m + ' ' + (m===1 ? L[0][0] : L[0][1]);
  const h = Math.floor(m/60); return h + ' ' + (h===1 ? L[1][0] : L[1][1]);
}
async function fetchFeed(feed){
  for(const make of PROXIES){
    try{
      const r = await fetch(make(feed.url), { cache:'no-store' });
      if(!r.ok) continue;
      const text = await r.text();
      if(text.trim().startsWith('{')){
        const j = JSON.parse(text);
        if(j && j.items) return j.items.map(it => ({ title: it.title || '', link: it.link || '', desc: strip(it.description || it.content || ''), date: new Date(it.pubDate || ''), img: (it.enclosure && it.enclosure.link) || (it.thumbnail) || '', source: feed.name }));
        continue;
      }
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      const items = [...doc.querySelectorAll('item')].map(it => {
        const get = t => { const n = it.getElementsByTagName(t)[0]; return n ? n.textContent : ''; };
        let img = '';
        const media = it.getElementsByTagName('media:content')[0] || it.getElementsByTagName('media:thumbnail')[0];
        if(media && media.getAttribute('url')) img = media.getAttribute('url');
        const enc = it.getElementsByTagName('enclosure')[0];
        if(!img && enc && (enc.getAttribute('type')||'').startsWith('image')) img = enc.getAttribute('url');
        if(!img){ const d = document.createElement('div'); d.innerHTML = get('description'); const im = d.querySelector('img'); if(im) img = im.src; }
        return { title: get('title'), link: get('link'), desc: strip(get('description')), date: new Date(get('pubDate') || get('dc:date') || ''), img, source: feed.name };
      });
      if(items.length) return items;
    }catch(e){ /* try next proxy */ }
  }
  return [];
}
async function loadCoins(){
  const box = document.getElementById('coins');
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=15&page=1&price_change_percentage=24h', { cache:'no-store' });
    if(!r.ok) throw new Error('cg');
    const coins = await r.json();
    box.innerHTML = coins.map(c => {
      const ch = c.price_change_percentage_24h_in_currency || 0;
      const cls = ch >= 0 ? 'up' : 'down';
      const price = c.current_price >= 1 ? '$' + c.current_price.toLocaleString('en-US', {maximumFractionDigits: 2}) : '$' + c.current_price;
      return '<div class="coin"><div class="nm"><img src="' + esc(c.image) + '" alt="">' + esc(c.name) + ' <span style="color:#93a7c4">' + esc((c.symbol||'').toUpperCase()) + '</span></div>'
        + '<div class="pr">' + price + '</div><div class="ch ' + cls + '">' + (ch >= 0 ? '▲' : '▼') + ' ' + Math.abs(ch).toFixed(2) + '% (24h)</div></div>';
    }).join('');
  }catch(e){
    try{
      const syms = ['BTCUSDT','ETHUSDT','USDTUSD','USDCUSDT','BNBUSDT','XRPUSDT','SOLUSDT','DOGEUSDT'];
      const out = [];
      for(const s of syms){
        const r = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=' + s, { cache:'no-store' });
        if(r.ok){ const t = await r.json(); out.push({ name: s.replace('USDT','').replace('USD',''), price: parseFloat(t.lastPrice), ch: parseFloat(t.priceChangePercent) }); }
      }
      if(out.length) box.innerHTML = out.map(c => '<div class="coin"><div class="nm">' + esc(c.name) + '</div><div class="pr">$' + c.price.toLocaleString('en-US', {maximumFractionDigits: 2}) + '</div><div class="ch ' + (c.ch >= 0 ? 'up' : 'down') + '">' + (c.ch >= 0 ? '▲' : '▼') + ' ' + Math.abs(c.ch).toFixed(2) + '% (24h)</div></div>').join('');
    }catch(e2){ /* keep placeholder */ }
  }
}
function render(items){
  const ui = LANGS[curLang].ui;
  const content = document.getElementById('content');
  document.getElementById('ticker').innerHTML = items.slice(0,10).map(i => ' 🔴 ' + esc(i.title)).join(' &nbsp;•&nbsp; ') + ' &nbsp;•&nbsp; ';
  if(!items.length){ content.innerHTML = '<div class="err">' + esc(ui.loading) + '</div>'; return; }
  const hero = items[0], rest = items.slice(1, 25);
  const sumHtml = (it, long) => {
    const d = it.desc || '';
    const words = d.split(' ');
    const n = long ? 45 : 30;
    if(words.length <= n) return esc(d);
    return esc(words.slice(0, n).join(' ')) + '<span class="more"> ' + esc(words.slice(n).join(' ')) + '</span>';
  };
  const actions = it => '<div class="actions">'
    + '<button class="btn btn-line" type="button" onclick="toggleSum(this)">' + esc(ui.seeMore) + '</button>'
    + '<a class="btn btn-red" href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(ui.full) + ' →</a></div>';
  let html = '<article class="hero">'
    + (hero.img ? '<div class="imgwrap"><img src="' + esc(hero.img) + '" alt="" loading="lazy"><div class="onimg"><span class="badge">' + esc(ui.breaking) + '</span><h2>' + esc(hero.title) + '</h2></div></div>'
                : '<div class="body"><span class="badge">' + esc(ui.breaking) + '</span><h2>' + esc(hero.title) + '</h2></div>')
    + '<div class="body">'
    + '<div class="meta">' + esc(ui.src) + ': ' + esc(hero.source) + ' · ' + esc(ago(hero.date, curLang)) + '</div>'
    + '<p class="sum">' + sumHtml(hero, true) + '</p>' + actions(hero) + '</div></article>';
  html += '<div class="grid">' + rest.map(it => '<article class="card">'
    + (it.img ? '<img src="' + esc(it.img) + '" alt="" loading="lazy">' : '')
    + '<div class="body"><h3>' + esc(it.title) + '</h3>'
    + '<div class="meta">' + esc(ui.src) + ': ' + esc(it.source) + ' · ' + esc(ago(it.date, curLang)) + '</div>'
    + '<p class="sum">' + sumHtml(it, false) + '</p>' + actions(it) + '</div></article>').join('') + '</div>';
  content.innerHTML = html;
}
function toggleSum(btn){
  const sum = btn.closest('.body').querySelector('.sum');
  const ui = LANGS[curLang].ui;
  const open = sum.classList.toggle('open');
  btn.textContent = open ? ui.seeLess : ui.seeMore;
  if(open) btn.closest('article').scrollIntoView({ behavior:'smooth', block:'start' });
}
async function load(){
  const L = LANGS[curLang], ui = L.ui;
  document.documentElement.lang = curLang;
  document.body.dir = L.dir;
  document.getElementById('content').className = L.cls;
  const lt = document.getElementById('loadingTxt'); if(lt) lt.textContent = ui.loading;
  const feeds = (L.feeds[curCat] || L.feeds.world);
  let items = [];
  for(const f of feeds){ items = items.concat(await fetchFeed(f)); }
  items.sort((a,b) => (b.date - a.date) || 0);
  items = items.filter(i => i.title);
  render(items);
  const now = new Date();
  document.getElementById('updatedTxt').textContent = ui.updated + ': ' + now.toLocaleTimeString(LOCALES[curLang], {hour:'2-digit', minute:'2-digit'});
  const greg = now.toLocaleDateString(LOCALES[curLang], { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  let hijri = '';
  try {
    const hLoc = (curLang === 'ja' || curLang === 'zh') ? 'en-u-ca-islamic-umalqura-nu-latn' : LOCALES[curLang] + '-u-ca-islamic-umalqura-nu-latn';
    hijri = new Intl.DateTimeFormat(hLoc, { day:'numeric', month:'long', year:'numeric' }).format(now);
  } catch(e){ hijri = ''; }
  const hLabel = { en:'Hijri', ur:'ہجری', ar:'الهجري', ja:'ヒジュラ暦', zh:'伊斯兰历' }[curLang] || 'Hijri';
  document.getElementById('dateTxt').textContent = hijri ? (greg + '  •  ' + hLabel + ': ' + hijri) : greg;
}
function buildChrome(){
  const wrap = document.getElementById('langs');
  wrap.innerHTML = '';
  Object.keys(LANGS).forEach(k => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = LANGS[k].label;
    if(k === curLang) b.className = 'on';
    b.onclick = () => { curLang = k; curCat = 'world'; try{ history.replaceState(null, '', '?lang=' + k); }catch(e){} buildChrome(); load(); loadCoins(); };
    wrap.appendChild(b);
  });
  const cats = document.getElementById('cats');
  cats.innerHTML = '';
  const ui = LANGS[curLang].ui;
  Object.keys(LANGS[curLang].feeds).forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = ui.cats[c] || c;
    if(c === curCat) b.className = 'on';
    b.onclick = () => { curCat = c; buildChrome(); load(); };
    cats.appendChild(b);
  });
  document.getElementById('refreshBtn').textContent = '↻ ' + ui.refresh;
  document.getElementById('cryptoTitle').textContent = '💰 ' + ui.crypto;
  document.getElementById('newsTitle').textContent = '📰 ' + ui.latest;
}
document.getElementById('refreshBtn').onclick = () => { load(); loadCoins(); };
buildChrome();
load();
loadCoins();
setInterval(load, 10 * 60 * 1000);
setInterval(loadCoins, 60 * 1000);
</script>
